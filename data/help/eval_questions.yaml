# Help-agent evaluation set. Hand-written questions of the kind the target users
# ask, in English, Hinglish and Hindi. `gold` lists label substrings of the
# passages that answer the question; retrieval counts as a hit if any retrieved
# passage's label contains any of them. Controls have no answer in the corpus
# and must be refused -- an agent that answers everything scores perfect
# coverage while being unsafe, the same reason the gate suite has controls.
#
# No personal data appears here: the questions are about the form, not a person.

