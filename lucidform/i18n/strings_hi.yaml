# Hindi strings. Phase 6 reviews these with a native speaker and evaluates them;
# they are in place now so the language boundary is exercised from the start
# rather than retro-fitted, and so a missing key shows up as a test failure
# instead of a silent fallback to English mid-conversation.

greeting: >-
  मैं आपको यह फॉर्म भरने में मदद करूँगा। मैं एक-एक करके सवाल पूछूँगा।
  हर जवाब के बाद मैं उसे आपको दोहराकर सुनाऊँगा, और वह तभी सेव होगा जब आप कहेंगे
  कि सही है। कोई सवाल समझ न आए तो कहिए "इसका मतलब क्या है", मैं समझा दूँगा।

readback: 'आपका {label} है: {value}। क्या यह सही है?'

confirmed: सेव हो गया।

denied: ठीक है, फिर से कोशिश करते हैं।

not_understood: >-
  माफ़ कीजिए, मुझे उसमें कोई जवाब नहीं मिला। क्या आप फिर से बता सकते हैं?

problem: 'इसमें एक दिक्कत है: {detail}'

retry: एक बार और कोशिश करते हैं।

required: >-
  माफ़ कीजिए, यह खाली नहीं छोड़ सकते। इसके बिना फॉर्म अस्वीकार हो जाएगा।

declined: ठीक है, मैं इसे खाली छोड़ देता हूँ।

abandoned: >-
  {label} पर हम बाद में वापस आएँगे।

out_of_attempts: >-
  अभी आगे बढ़ते हैं, {label} पर अंत में वापस आएँगे।

progress: '{total} में से {done} हो गए।'

closing: >-
  बस इतना ही। {committed} जवाब सेव हो गए{declined_note}।

declined_note_some: ', {count} आपके कहने पर खाली छोड़े गए'

incomplete: >-
  {count} अभी बाकी हैं: {fields}।

help_source: '(स्रोत: {sources}।)'

help_uncertain: >-
  मैं इस बारे में पक्का नहीं हूँ, इसलिए बताता हूँ कि इस खाने का मतलब क्या है:

revisit: >-
  समाप्त करने से पहले, जो अभी बाकी है उस पर वापस चलते हैं: {fields}।

review_intro: 'मैंने यह सब सहेजा है:'

review_prompt: >-
  क्या यह सब सही है? समाप्त करने के लिए हाँ कहें, या जिसे बदलना है उसका नाम
  बताएँ, जैसे "शहर बदलें"।

review_done: धन्यवाद। फॉर्म पूरा हो गया।

review_unclear: >-
  माफ़ कीजिए, मैं समझ नहीं पाया। सब सही है तो हाँ कहें, या जिसे बदलना है उसका
  नाम बताएँ।

proposal: 'आपका पिन कोड {pin} {place} में है।'

suggestion: 'शायद आपका मतलब {value} था।'

proposal_place: 'हस्ताक्षर के स्थान में मैं {place} लिखूँगा।'

own_pdf_ask: >-
  क्या आप अपना खुद का पीडीएफ फॉर्म भरना चाहते हैं? उसकी जगह बताने के लिए हाँ कहें,
  या पहले से मौजूद केवाईसी फॉर्म के लिए नहीं कहें।

own_pdf_path: >-
  अपनी पीडीएफ फ़ाइल का पूरा पता पेस्ट करें। फ़ाइल एक्सप्लोरर में फ़ाइल पर राइट-क्लिक
  करके "Copy as path" चुनें, फिर यहाँ पेस्ट करें।

own_pdf_bad: 'मैं उस फ़ाइल का उपयोग नहीं कर सकता: {reason}'

own_pdf_ok: 'मैंने "{title}" खोल लिया है। मैं आपसे इसकी {count} बातें पूछूँगा।'

own_pdf_skipped: >-
  इन हिस्सों पर प्रिंट के बाद हाथ से निशान या हस्ताक्षर करना होगा: {fields}।

own_pdf_fallback: ठीक है, हम पहले से मौजूद केवाईसी फॉर्म का उपयोग करेंगे।
